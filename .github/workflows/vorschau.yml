# Bei Bedarf: Screenshot der veröffentlichten Karte erstellen und prüfen, ob die Echtzeit-Funktion antwortet.
name: vorschau
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vorschau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Daten und Echtzeit prüfen
        run: |
          B=https://melvinu2tj.github.io/fantastic-telegram
          curl -sS $B/data/version.json; echo
          for f in segments network borders ids; do printf "%s: " $f; curl -sS -o /dev/null -w "%{size_download} Bytes\n" $B/data/$f.json; done
          curl -sS $B/data/day-$(TZ=Europe/Berlin date +%Y%m%d).json | python3 -c "import json,sys,collections; d=json.load(sys.stdin); print('Fahrten heute:', len(d['trips']), collections.Counter(t[1] for t in d['trips']))"
          curl -sS -o rt.json -w "Vercel HTTP %{http_code}, %{time_total} s\n" https://fantastic-telegram-35tn.vercel.app/api/delays || true
          python3 -c "import json; d=json.load(open('rt.json')); print('Vercel:', {k:(len(v) if isinstance(v,(list,dict)) else v) for k,v in d.items()})" || head -c 400 rt.json
          # Verspätungsgründe: Zugangsdaten und Schnittstelle prüfen (Planankunft zur vollen Stunde in Berlin)
          curl -sS -w "\nGrund HTTP %{http_code}\n" "https://fantastic-telegram-35tn.vercel.app/api/grund?ziel=Berlin%20Hbf&an=$(TZ=Europe/Berlin date +%y%m%d%H)00&name=RE1" || true
      - name: Screenshot
        run: |
          npm i -s playwright@1.48.2 && npx playwright install --with-deps chromium >/dev/null
          cat > shot.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 1920, height: 1080 } });
            p.on('console', m => console.log('console', m.type(), m.text()));
            await p.goto('https://melvinu2tj.github.io/fantastic-telegram/');
            await p.waitForTimeout(15000);
            console.log('aktive Züge:', await p.evaluate(() => aktiv.length));
            await p.screenshot({ path: 'vorschau.png' });
            await p.goto('https://melvinu2tj.github.io/fantastic-telegram/?land=brandenburg');
            await p.waitForTimeout(15000);
            console.log('Städte:', await p.evaluate(() => orte.length));
            await p.screenshot({ path: 'vorschau-zoom.png' });
            // Den am stärksten verspäteten Zug anklicken
            const pt = await p.evaluate(() => { let b = -1; for (let i = 0; i < tN; i++) if (b < 0 || tV[i] > tV[b]) b = i; return b < 0 ? null : [tX[b] / view.dpr, tY[b] / view.dpr]; });
            if (pt) { await p.keyboard.down('Control'); await p.mouse.click(pt[0], pt[1]); await p.keyboard.up('Control'); await p.waitForTimeout(4000); }
            console.log('Karte:', await p.evaluate(() => karte.innerText), await p.evaluate(() => karte.querySelector('a')?.href));
            await p.screenshot({ path: 'vorschau-klick.png' });
            await b.close();
          })();
          JS
          node shot.js
      - name: Im Release "vorschau" ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view vorschau >/dev/null 2>&1 || gh release create vorschau --title "Vorschau" --notes "Screenshots der Karte."
          gh release upload vorschau vorschau.png vorschau-zoom.png vorschau-klick.png --clobber
