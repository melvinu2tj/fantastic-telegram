<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zugkarte</title>
<style>
  html, body { margin: 0; height: 100%; background: #04060a; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #status, #quelle { position: fixed; bottom: 8px; font: 11px system-ui, sans-serif; color: rgba(160,175,200,.35); }
  #status { right: 12px; }
  #quelle { left: 12px; color: rgba(160,175,200,.16); font-size: 10px; }
  #karte { position: fixed; z-index: 2; max-width: 320px; padding: 8px 11px; border-radius: 8px;
    background: rgba(8,12,20,.88); border: 1px solid rgba(170,185,210,.18);
    font: 12px/1.45 system-ui, "Segoe UI", sans-serif; color: rgba(205,215,232,.9); }
  #karte .zug { font-weight: 600; font-size: 13px; }
  #karte .lage { color: rgba(205,215,232,.65); }
  #karte a { display: inline-block; margin-top: 4px; color: rgba(140,200,255,.9); text-decoration: none; }
  #karte a:hover { text-decoration: underline; }
</style>
</head>
<body>
<canvas id="netz"></canvas>
<canvas id="zuege"></canvas>
<div id="status"></div>
<div id="karte" hidden></div>
<div id="quelle">Daten: © OpenStreetMap-Mitwirkende · DELFI/gtfs.de</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
